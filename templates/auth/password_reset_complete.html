{% extends 'base.html' %}

{% block auth_content %}
<div class="auth-wrapper">
  <div class="auth-card" style="text-align: center;">
    <div class="brand-icon" style="width: 44px; height: 44px; font-size: 1.35rem; margin: 0 auto 1rem auto;">✓</div>
    <h2 class="auth-title">Password Reset Complete</h2>
    <p class="auth-subtitle" style="margin-top: 0.75rem;">
      Your password has been set successfully. You can now log in with your new credentials.
    </p>
    <div style="margin-top: 1.5rem;">
      <a href="{% url 'login' %}" class="btn btn-primary" style="width: 100%;">Sign In Now</a>
    </div>
  </div>
</div>
{% endblock %}
