{% extends 'base.html' %}

{% block auth_content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div style="display: flex; justify-content: center; margin-bottom: 0.75rem;">
        <div class="brand-icon" style="width: 44px; height: 44px; font-size: 1.35rem;">N</div>
      </div>
      <h2 class="auth-title">Reset Password</h2>
      <p class="auth-subtitle">Enter your registered email address and we'll send you a secure recovery link.</p>
    </div>

    <form method="post" novalidate id="password-reset-form">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label" for="id_email">Email Address</label>
        <input type="email" name="email" id="id_email" class="form-input" placeholder="name@company.com" required>
        {% if form.email.errors %}
        <div class="form-error">{{ form.email.errors.0 }}</div>
        {% endif %}
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; margin-top: 0.5rem;">
        Send Recovery Link
      </button>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem;">
        <a href="{% url 'login' %}">&larr; Back to Sign In</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
